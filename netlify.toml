# Daily Drip Cafe — static site, no build step.
[build]
  publish = "."
  command = ""

# Admin Console shortcut: /admin serves the console (no login walls on CDN).
[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

# Cache food photos + films for a year (filenames are content-hashed).
[[headers]]
  for = "/menu_images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
